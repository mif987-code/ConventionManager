<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Convention Player</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --surface2: #334155;
      --accent: #6366f1; --accent-light: #818cf8;
      --green: #22c55e; --red: #ef4444; --yellow: #eab308; --cyan: #06b6d4;
      --text: #f1f5f9; --text2: #94a3b8; --text3: #64748b;
      --radius: 12px; --nav-h: 60px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; overflow-x: hidden; }
    .hidden { display: none !important; }

    /* --- Login Screen --- */
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100dvh; padding: 24px; }
    #login-screen h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 4px; background: linear-gradient(135deg, var(--accent-light), var(--cyan)); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #login-screen .subtitle { color: var(--text2); font-size: 0.85rem; margin-bottom: 32px; }
    .login-box { width: 100%; max-width: 380px; }
    .login-section { background: var(--surface); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
    .login-section h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text2); margin-bottom: 12px; }
    .login-input { width: 100%; background: var(--surface2); border: 1px solid transparent; color: var(--text); padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; outline: none; margin-bottom: 10px; transition: border-color 0.2s; }
    .login-input:focus { border-color: var(--accent); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; border-radius: 8px; padding: 10px 20px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.15s; width: 100%; }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { background: var(--accent-light); }
    .btn-outline { background: transparent; color: var(--accent-light); border: 1.5px solid var(--accent); }
    .btn-outline:hover { background: rgba(99,102,241,0.1); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-error { color: var(--red); font-size: 0.8rem; margin-bottom: 8px; }
    .login-or { text-align: center; color: var(--text3); font-size: 0.75rem; margin: 8px 0; text-transform: uppercase; letter-spacing: 0.08em; }

    /* --- Main App Shell --- */
    #app-shell { display: none; flex-direction: column; min-height: 100dvh; }
    #app-shell.active { display: flex; }
    #page-content { flex: 1; overflow-y: auto; padding: 16px 16px calc(var(--nav-h) + 16px); }

    /* Bottom Nav */
    #bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h); background: var(--surface); border-top: 1px solid var(--surface2); display: flex; z-index: 100; }
    .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text3); font-size: 0.65rem; font-weight: 600; border: none; background: none; cursor: pointer; transition: color 0.15s; padding: 4px 0; }
    .nav-btn.active { color: var(--accent-light); }
    .nav-btn svg { width: 22px; height: 22px; }
    .nav-label { margin-top: 1px; }

    /* Page header */
    .page-hdr { font-size: 1.3rem; font-weight: 700; margin-bottom: 16px; }

    /* Cards */
    .card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
    .card-sm { padding: 12px; }

    /* Balance bar */
    .balance-bar { display: flex; gap: 10px; margin-bottom: 16px; }
    .bal-card { flex: 1; background: var(--surface); border-radius: var(--radius); padding: 14px; text-align: center; }
    .bal-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 4px; }
    .bal-value { font-size: 1.5rem; font-weight: 800; }
    .bal-vouchers .bal-value { color: var(--green); }
    .bal-tix .bal-value { color: var(--cyan); }

    /* Profile */
    .profile-field { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--surface2); font-size: 0.9rem; }
    .profile-field:last-child { border-bottom: none; }
    .profile-key { color: var(--text2); }
    .profile-val { font-weight: 600; }

    /* Event list */
    .evt-card { background: var(--surface); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; cursor: pointer; transition: background 0.15s; }
    .evt-card:hover { background: var(--surface2); }
    .evt-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
    .evt-meta { font-size: 0.75rem; color: var(--text2); display: flex; flex-wrap: wrap; gap: 8px; }
    .badge { display: inline-block; font-size: 0.65rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge-open { background: rgba(34,197,94,0.15); color: var(--green); }
    .badge-ongoing { background: rgba(234,179,8,0.15); color: var(--yellow); }
    .badge-finished { background: rgba(100,116,139,0.2); color: var(--text3); }
    .badge-registered { background: rgba(99,102,241,0.15); color: var(--accent-light); }
    .badge-elim { background: rgba(239,68,68,0.15); color: var(--red); }
    .badge-swiss { background: rgba(6,182,212,0.15); color: var(--cyan); }

    /* Store */
    .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .store-item { background: var(--surface); border-radius: var(--radius); padding: 14px; text-align: center; }
    .store-item-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
    .store-item-price { color: var(--cyan); font-weight: 800; font-size: 1.1rem; margin-bottom: 2px; }
    .store-item-stock { font-size: 0.7rem; color: var(--text3); margin-bottom: 8px; }
    .store-item-desc { font-size: 0.75rem; color: var(--text2); margin-bottom: 10px; min-height: 32px; }
    .btn-sm { padding: 7px 14px; font-size: 0.8rem; width: auto; }

    /* Event detail overlay */
    #event-detail { display: none; position: fixed; inset: 0; z-index: 200; background: var(--bg); overflow-y: auto; padding: 16px; }
    #event-detail.active { display: block; }
    .back-btn { background: none; border: none; color: var(--accent-light); font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; gap: 4px; }

    /* Standings table */
    .standings-tbl { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .standings-tbl th { text-align: left; padding: 8px; color: var(--text3); font-size: 0.7rem; text-transform: uppercase; border-bottom: 1px solid var(--surface2); }
    .standings-tbl td { padding: 8px; border-bottom: 1px solid rgba(51,65,85,0.4); }
    .standings-tbl .me { background: rgba(99,102,241,0.1); }

    /* Toast */
    .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--surface2); color: var(--text); padding: 10px 20px; border-radius: 8px; font-size: 0.85rem; z-index: 999; box-shadow: 0 4px 20px rgba(0,0,0,0.4); transition: opacity 0.3s; }
    .toast.error { border-left: 3px solid var(--red); }
    .toast.success { border-left: 3px solid var(--green); }

    /* Collection */
    .coll-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .coll-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .coll-img-wrap { width: 80px; height: 80px; border-radius: 14px; display: flex; align-items: center; justify-content: center; border: 2px solid transparent; overflow: hidden; position: relative; }
    .coll-img-wrap.earned { border-color: var(--accent); box-shadow: 0 0 12px rgba(99,102,241,0.35); }
    .coll-img-wrap.locked { filter: grayscale(1); opacity: 0.35; border-color: var(--surface2); }
    .coll-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .coll-img-wrap .coll-placeholder { width: 100%; height: 100%; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 2rem; }
    .coll-name { font-size: 0.7rem; font-weight: 600; text-align: center; color: var(--text2); max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .coll-name.earned { color: var(--text); }
    .coll-earned-tag { font-size: 0.6rem; color: var(--accent-light); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .coll-set { background: var(--surface); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
    .coll-set-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .coll-set-name { font-weight: 700; font-size: 0.9rem; }
    .coll-progress-bar { height: 4px; background: var(--surface2); border-radius: 2px; margin-bottom: 12px; overflow: hidden; }
    .coll-progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s; }
    .coll-set-bonus { font-size: 0.7rem; color: var(--cyan); font-weight: 700; }

    /* Responsive */
    @media (min-width: 640px) { #page-content { max-width: 600px; margin: 0 auto; } }
  </style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="login-screen">
  <h1>Convention Player</h1>
  <p class="subtitle">Sign in to manage your account</p>
  <div class="login-box">
    <div class="login-section">
      <h3>Scan NFC Tag</h3>
      <button class="btn btn-outline" id="nfc-login-btn" onclick="loginNfc()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 7v-1a2 2 0 012-2h3m-5 6v6a2 2 0 002 2h3m7-16h3a2 2 0 012 2v1m0 4v6a2 2 0 01-2 2h-3"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
        Tap NFC Tag
      </button>
    </div>
    <div class="login-or">or</div>
    <div class="login-section">
      <h3>Email &amp; Password</h3>
      <div id="login-error" class="login-error hidden"></div>
      <input class="login-input" id="login-email" type="email" placeholder="Email" autocomplete="email">
      <input class="login-input" id="login-pass" type="password" placeholder="Password" autocomplete="current-password">
      <button class="btn btn-accent" onclick="loginEmail()">Sign In</button>
    </div>
  </div>
</div>

<!-- ===== APP SHELL ===== -->
<div id="app-shell">
  <div id="page-content"></div>

  <nav id="bottom-nav">
    <button class="nav-btn active" data-page="profile" onclick="navigate('profile')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="nav-label">Profile</span>
    </button>
    <button class="nav-btn" data-page="events" onclick="navigate('events')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="nav-label">Events</span>
    </button>
    <button class="nav-btn" data-page="store" onclick="navigate('store')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      <span class="nav-label">Store</span>
    </button>
    <button class="nav-btn" data-page="collection" onclick="navigate('collection')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span class="nav-label">Collection</span>
    </button>
  </nav>
</div>

<!-- ===== EVENT DETAIL OVERLAY ===== -->
<div id="event-detail"></div>

<script src="app.js"></script>
</body>
</html>
