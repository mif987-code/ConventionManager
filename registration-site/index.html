<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convention Pre-Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50 min-h-screen">
  <div class="max-w-lg mx-auto px-4 py-8">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 rounded-2xl mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      </div>
      <h1 id="convention-title" class="text-3xl font-bold text-gray-800">Convention Registration</h1>
      <p class="text-gray-500 mt-2">Pre-register to get your wristband faster at the event!</p>
      <div id="convention-dates" class="hidden mt-2 text-sm text-indigo-600 font-medium"></div>
    </div>

    <!-- Form -->
    <div id="form-section">
      <form id="reg-form" class="bg-white rounded-2xl shadow-lg border border-gray-100 p-6 space-y-5">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">First Name <span class="text-red-500">*</span></label>
            <input type="text" id="name" required placeholder="John"
              class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Last Name <span class="text-red-500">*</span></label>
            <input type="text" id="last_name" required placeholder="Doe"
              class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email <span class="text-red-500">*</span></label>
          <input type="email" id="email" required placeholder="john@example.com"
            class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition" />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Date of Birth</label>
            <input type="date" id="dob"
              class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Age</label>
            <input type="number" id="age" min="5" max="120" placeholder="25"
              class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition" />
          </div>
        </div>

        <div id="attendance-section" class="hidden">
          <label class="block text-sm font-medium text-gray-700 mb-2">Which days will you attend? <span class="text-gray-400 font-normal">(Select all that apply)</span></label>
          <div id="attendance-dates-container" class="space-y-2"></div>
        </div>

        <!-- Packages Section -->
        <div id="packages-section" class="hidden">
          <label class="block text-sm font-medium text-gray-700 mb-2">Select a Package <span class="text-gray-400 font-normal">(Optional - skip to pay per day)</span></label>
          <div id="packages-container" class="space-y-3"></div>
        </div>

        <!-- Event Pre-registration Section -->
        <div id="events-section" class="hidden">
          <label class="block text-sm font-medium text-gray-700 mb-2">Pre-register for Events <span class="text-gray-400 font-normal">(Optional - save your spot)</span></label>
          <div id="events-container" class="space-y-3"></div>
        </div>

        <!-- Error / loading -->
        <div id="error-msg" class="hidden text-sm bg-red-50 text-red-700 px-4 py-3 rounded-lg border border-red-200"></div>

        <button type="submit" id="submit-btn"
          class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition font-semibold text-sm flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          Pre-Register
        </button>
      </form>
    </div>

    <!-- Success -->
    <div id="success-section" class="hidden fade-in">
      <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-8 text-center">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-green-100 rounded-full mb-4">
          <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">You're Pre-Registered!</h2>
        <p id="success-message" class="text-gray-500 mb-4">Show up at the convention desk to get your NFC wristband linked to your account.</p>
        <div id="success-details" class="bg-gray-50 rounded-lg p-4 text-left text-sm space-y-1 mb-6"></div>
        <button onclick="resetForm()" class="text-indigo-600 hover:text-indigo-700 font-medium text-sm">Register another person</button>
      </div>
    </div>

    <!-- Payment Modal -->
    <div id="payment-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
      <div class="bg-white rounded-2xl shadow-lg max-w-md w-full p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-bold text-gray-800">Complete Payment</h2>
          <button onclick="closePaymentModal()" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="payment-details" class="bg-gray-50 rounded-lg p-4 mb-4"></div>
        <button onclick="completePayment()" id="complete-payment-btn" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition font-semibold text-sm">
          Proceed to Payment
        </button>
      </div>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">Your information will be used for event management only.</p>
  </div>

  <script>
    // Use relative URL — works when served by backend at /register or standalone
    const API_BASE = '/public';

    const form = document.getElementById('reg-form');
    const errorMsg = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submit-btn');
    const formSection = document.getElementById('form-section');
    const successSection = document.getElementById('success-section');
    const successDetails = document.getElementById('success-details');
    const conventionTitle = document.getElementById('convention-title');
    const conventionDates = document.getElementById('convention-dates');
    const attendanceSection = document.getElementById('attendance-section');
    const attendanceDatesContainer = document.getElementById('attendance-dates-container');
    const packagesSection = document.getElementById('packages-section');
    const packagesContainer = document.getElementById('packages-container');
    const eventsSection = document.getElementById('events-section');
    const eventsContainer = document.getElementById('events-container');
    const paymentModal = document.getElementById('payment-modal');
    const paymentDetails = document.getElementById('payment-details');
    const completePaymentBtn = document.getElementById('complete-payment-btn');

    let availableDates = [];
    let packages = [];
    let events = [];
    let scanMode = 'nfc'; // Default to NFC
    let paymentMode = 'direct'; // 'direct' (no payment) or 'payment' (requires payment)
    let pendingPayment = null;

    // Load convention info on page load
    async function loadConventionInfo() {
      try {
        const res = await fetch(`${API_BASE}/convention`);
        const json = await res.json();

        console.log('Convention data:', json);

        if (json.convention) {
          conventionTitle.textContent = json.convention.name;
          if (json.convention.start_date && json.convention.end_date) {
            const start = new Date(json.convention.start_date).toLocaleDateString();
            const end = new Date(json.convention.end_date).toLocaleDateString();
            conventionDates.textContent = `${start} - ${end}`;
            conventionDates.classList.remove('hidden');
          }

          // Store scan mode
          scanMode = json.convention.scan_mode || 'nfc';

          availableDates = json.available_dates || [];
          console.log('Available dates:', availableDates);
          if (availableDates.length > 0) {
            attendanceSection.classList.remove('hidden');
            renderAttendanceDates();
          }

          // Store and render packages
          packages = json.packages || [];
          console.log('Packages:', packages);
          if (packages.length > 0) {
            packagesSection.classList.remove('hidden');
            renderPackages();
          }

          // Store and render events
          events = json.events || [];
          console.log('Events:', events);
          if (events.length > 0) {
            eventsSection.classList.remove('hidden');
            renderEvents();
          }
        }
      } catch (err) {
        console.error('Failed to load convention info:', err);
      }
    }

    function renderAttendanceDates() {
      attendanceDatesContainer.innerHTML = availableDates.map(date => `
        <label class="flex items-center gap-2 p-2 bg-gray-50 rounded-lg cursor-pointer hover:bg-gray-100 transition">
          <input type="checkbox" name="attendance_date" value="${date}" class="w-4 h-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500">
          <span class="text-sm text-gray-700">${new Date(date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</span>
        </label>
      `).join('');
    }

    function renderPackages() {
      packagesContainer.innerHTML = packages.map(pkg => `
        <label class="flex items-start gap-3 p-4 bg-gray-50 rounded-lg cursor-pointer hover:bg-gray-100 transition border border-gray-200">
          <input type="radio" name="package" value="${pkg.id}" class="w-4 h-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500 mt-1">
          <div class="flex-1">
            <div class="flex items-center justify-between">
              <span class="font-medium text-gray-800">${pkg.name}</span>
              <span class="font-bold text-indigo-600">$${pkg.prereg_cost || pkg.cost}</span>
            </div>
            ${pkg.description ? `<p class="text-sm text-gray-500 mt-1">${pkg.description}</p>` : ''}
            <p class="text-xs text-gray-400 mt-1">${pkg.days} day${pkg.days !== 1 ? 's' : ''} included</p>
            ${pkg.prereg_cost && pkg.regular_voucher_amount ? `<p class="text-xs text-green-600 mt-1">Includes ${pkg.regular_voucher_amount} voucher${pkg.regular_voucher_amount !== 1 ? 's' : ''}</p>` : ''}
            ${pkg.prereg_cost && !pkg.regular_voucher_amount && pkg.prereg_cost !== pkg.cost ? `<p class="text-xs text-orange-600 mt-1">Pre-registration price (regularly $${pkg.cost})</p>` : ''}
          </div>
        </label>
      `).join('');
    }

    function renderEvents() {
      eventsContainer.innerHTML = events.map(evt => `
        <label class="flex items-start gap-3 p-4 bg-gray-50 rounded-lg cursor-pointer hover:bg-gray-100 transition border border-gray-200">
          <input type="checkbox" name="event_prereg" value="${evt.id}" class="w-4 h-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500 mt-1">
          <div class="flex-1">
            <span class="font-medium text-gray-800">${evt.name}</span>
            <p class="text-sm text-gray-500 mt-1">
              ${evt.max_players ? `Max ${evt.max_players} participants` : ''}
              ${evt.entry_cost_vouchers ? ` • ${evt.entry_cost_vouchers} vouchers entry` : ''}
            </p>
          </div>
        </label>
      `).join('');
    }

    // Auto-calculate age from DOB
    document.getElementById('dob').addEventListener('change', (e) => {
      const dob = new Date(e.target.value);
      if (isNaN(dob.getTime())) return;
      const today = new Date();
      let age = today.getFullYear() - dob.getFullYear();
      const m = today.getMonth() - dob.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
      document.getElementById('age').value = age;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> Registering...';

      // Get selected attendance dates
      const selectedDates = Array.from(document.querySelectorAll('input[name="attendance_date"]:checked'))
        .map(cb => cb.value);

      // Get selected package
      const packageInput = document.querySelector('input[name="package"]:checked');
      const selectedPackageId = packageInput ? parseInt(packageInput.value) : null;

      // Get selected events for pre-registration
      const selectedEvents = Array.from(document.querySelectorAll('input[name="event_prereg"]:checked'))
        .map(cb => parseInt(cb.value));

      const data = {
        name: document.getElementById('name').value.trim(),
        last_name: document.getElementById('last_name').value.trim(),
        email: document.getElementById('email').value.trim(),
        dob: document.getElementById('dob').value || null,
        age: document.getElementById('age').value ? parseInt(document.getElementById('age').value) : null,
        attendance_dates: selectedDates,
        package_id: selectedPackageId,
        event_prereg_ids: selectedEvents,
      };

      // Calculate total cost
      const selectedPackage = packages.find(p => p.id === selectedPackageId);
      const selectedEventObjs = events.filter(e => selectedEvents.includes(e.id));
      const packageCost = selectedPackage ? (selectedPackage.prereg_cost || selectedPackage.cost) : 0;
      const totalCost = packageCost; // Events currently don't have a cost for preregistration

      try {
        const res = await fetch(`${API_BASE}/preregister`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const json = await res.json();

        if (!res.ok) {
          throw new Error(json.error || 'Registration failed');
        }

        // Check if payment is required
        if (totalCost > 0) {
          // Show payment modal
          showPaymentModal(totalCost, {
            userId: json.user.id,
            userData: { ...data, id: json.user.id, attendanceDates: selectedDates },
            selectedPackage,
            selectedEventNames: selectedEventObjs.map(e => e.name),
            packageName: selectedPackage?.name,
            eventNames: selectedEventObjs.map(e => e.name),
          });
        } else {
          // Direct success, no payment needed
          showSuccess({ ...data, id: json.user.id, attendanceDates: selectedDates }, selectedPackage, selectedEventObjs.map(e => e.name), null);
        }
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Pre-Register';
      }
    });

    function resetForm() {
      form.reset();
      formSection.classList.remove('hidden');
      successSection.classList.add('hidden');
    }

    function showPaymentModal(amount, details) {
      paymentDetails.innerHTML = `
        <p class="text-sm text-gray-700"><span class="font-medium">Amount:</span> $${amount}</p>
        <p class="text-sm text-gray-700"><span class="font-medium">Package:</span> ${details.packageName || 'None'}</p>
        ${details.eventNames ? `<p class="text-sm text-gray-700"><span class="font-medium">Events:</span> ${details.eventNames.join(', ')}</p>` : ''}
      `;
      paymentModal.classList.remove('hidden');
      pendingPayment = { amount, details };
    }

    function closePaymentModal() {
      paymentModal.classList.add('hidden');
      pendingPayment = null;
    }

    async function completePayment() {
      if (!pendingPayment) return;

      completePaymentBtn.disabled = true;
      completePaymentBtn.textContent = 'Creating payment...';

      try {
        const response = await fetch('/api/payments/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: pendingPayment.details.userId, amount: pendingPayment.amount }),
        });

        const data = await response.json();
        if (data.success) {
          // Open payment URL
          window.open(data.paymentUrl, '_blank');
          closePaymentModal();
          // Show success message
          showSuccess(pendingPayment.details.userData, pendingPayment.details.selectedPackage, pendingPayment.details.selectedEventNames, data.paymentLink);
        } else {
          errorMsg.textContent = 'Payment creation failed';
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.remove('hidden');
      } finally {
        completePaymentBtn.disabled = false;
        completePaymentBtn.textContent = 'Proceed to Payment';
      }
    }

    function showSuccess(userData, selectedPackage, selectedEventNames, paymentLink) {
      const successMessageEl = document.getElementById('success-message');
      if (scanMode === 'qr') {
        successMessageEl.textContent = 'A personal and private QR code will be sent to you the day before the event to your email, it will also be available on the Event Application.';
      } else {
        successMessageEl.textContent = 'Show up at the convention desk to get your NFC wristband linked to your account.';
      }

      successDetails.innerHTML = `
        <p><span class="font-medium text-gray-700">Name:</span> ${userData.name} ${userData.last_name}</p>
        <p><span class="font-medium text-gray-700">Email:</span> ${userData.email}</p>
        ${userData.dob ? `<p><span class="font-medium text-gray-700">Date of Birth:</span> ${userData.dob}</p>` : ''}
        ${userData.age ? `<p><span class="font-medium text-gray-700">Age:</span> ${userData.age}</p>` : ''}
        ${userData.attendanceDates?.length > 0 ? `<p><span class="font-medium text-gray-700">Attending:</span> ${userData.attendanceDates.length} day(s)</p>` : ''}
        ${selectedPackage ? `<p><span class="font-medium text-gray-700">Package:</span> ${selectedPackage.name} ($${selectedPackage.cost})</p>` : ''}
        ${selectedEventNames?.length > 0 ? `<p><span class="font-medium text-gray-700">Pre-registered Events:</span> ${selectedEventNames.join(', ')}</p>` : ''}
        ${paymentLink ? `<p><span class="font-medium text-gray-700">Payment:</span> <a href="${paymentLink}" target="_blank" class="text-indigo-600 hover:underline">View Transaction</a></p>` : ''}
        <p class="mt-2 text-indigo-600 font-medium">Registration ID: #${userData.id}</p>
      `;
      formSection.classList.add('hidden');
      successSection.classList.remove('hidden');
    }

    // Load convention info on page load
    loadConventionInfo();
  </script>
</body>
</html>
